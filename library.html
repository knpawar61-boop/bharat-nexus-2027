        .lib-splash {
            position: fixed;
            inset: 0;
            z-index: 25000;
            background: radial-gradient(circle at center, #0e2a54 0%, #06142e 55%, #030a18 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .lib-splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-circle {
            width: clamp(190px, 34vw, 250px);
            height: clamp(190px, 34vw, 250px);
            border-radius: 50%;
            background: radial-gradient(circle, #102a56 0%, #071630 100%);
            border: 2.5px solid #d4af37;
            box-shadow: 0 0 38px rgba(56, 189, 248, 0.35), 0 0 22px rgba(212, 175, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            animation: circlePop 1.6s ease forwards;
        }

        .welcome-circle span {
            font-family: "Cinzel", Georgia, serif;
            font-size: clamp(17px, 2.6vw, 22px);
            font-weight: 700;
            letter-spacing: 2px;
            color: #f5d76e;
            line-height: 1.4;
        }

        @keyframes circlePop {
            0% { transform: scale(0.45); opacity: 0; }
            45% { transform: scale(1.06); opacity: 1; }
            85% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.12); opacity: 0.9; }
        }

        /* LIBRARY PAGE LAYOUT */
        .lib-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(6, 16, 34, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        body.light-mode .lib-header {
            background: rgba(255, 255, 255, 0.94);
        }

        .lib-nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-home-btn {
            background: var(--bg-card);
            color: var(--gold-soft);
            border: 1px solid var(--border-gold);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 700;
        }

        .back-home-btn:hover {
            background: var(--gold);
            color: #061022;
        }

        .lib-container {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            padding: 36px 5% 60px 5%;
        }

        /* GREETING + SPINNING BORDER TITLE */
        .lib-hero {
            text-align: center;
            margin-bottom: 32px;
        }

        .time-greeting {
            font-size: clamp(22px, 3.6vw, 34px);
            font-weight: 800;
            letter-spacing: 3px;
            color: #38bdf8;
            margin-bottom: 14px;
        }

        body.light-mode .time-greeting {
            color: #0369a1;
        }

        .lib-title-inner {
            padding: 14px 30px;
        }

        .lib-title-inner h1 {
            font-size: clamp(22px, 3.8vw, 36px);
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .lib-title-inner h1 span {
            color: var(--gold-soft);
        }

        .lib-date {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* DAILY MOTIVATIONAL QUOTE CARD */
        .quote-spotlight {
            background: var(--bg-surface);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .quote-label {
            display: inline-block;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-soft);
            margin-bottom: 10px;
        }

        .quote-text {
            font-size: clamp(17px, 2.3vw, 21px);
            font-weight: 600;
            color: var(--text-main);
            max-width: 820px;
            margin: 0 auto 8px auto;
            line-height: 1.6;
        }

        .quote-author {
            color: var(--gold-soft);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .quote-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

            text-align: center;
            margin-bottom: 24px;
        }

            max-width: 560px;
            padding: 14px 16px;
            border: 1.5px solid var(--gold);

            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 15.5px;
            margin-bottom: 16px;
            outline: none;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .book-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .book-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .bookmark-btn {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
        }

        .bookmark-btn.saved {
            background: var(--gold);
            color: #061022;
            font-weight: 700;
        }

        .book-card h3 {
            color: var(--text-main);
            font-size: 19px;
        }

        .book-card p {
            color: var(--text-muted);
            font-size: 14.5px;
        }

        .open-book-btn {
            margin-top: auto;
            background: var(--gold);
            color: #061022;
            border: none;
            border-radius: 8px;
            padding: 11px 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .open-book-btn:hover {
            background: #ffffff;
        }

        /* READER MODAL */
        .reader-modal {
            position: fixed;
            inset: 0;
            z-index: 15000;
            background: rgba(3, 8, 20, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .reader-modal[hidden] {
            display: none;
        }

        .reader-box {
            background: var(--bg-surface);
            border: 1.5px solid var(--gold);
            border-radius: 16px;
            max-width: 720px;
            width: 100%;
            max-height: 86vh;
            overflow-y: auto;
            padding: 26px;
        }

        .reader-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

            font-size: 22px;
            margin: 0;
        }

            display: flex;
            gap: 10px;
            flex-wrap: wrap;

                    en: [
                        { h: "1. What is the stock market?", p: ["A company needs money to grow. One way to raise it is to divide ownership into small pieces called shares and sell them to the public. When you buy a share, you own a tiny part of that company. In India, shares are bought and sold on two main exchanges: BSE (Bombay Stock Exchange) and NSE (National Stock Exchange). The market is watched over by a government regulator called SEBI, which makes rules to protect ordinary investors.", "Share prices go up and down every day. They move because of how well the company is doing, how many people want to buy or sell, and news about the economy. That daily movement is why shares can be risky for beginners who invest without understanding."] },
                        { h: "2. What are Sensex and Nifty?", p: ["Imagine a scoreboard for the whole market. The Sensex follows 30 large, well-known companies listed on the BSE. The Nifty 50 follows 50 large companies listed on the NSE. When the news says 'Sensex rose by 400 points', it means those big companies, taken together, became more valuable that day.", "Important: Sensex and Nifty are only scoreboards. They are not a company, and they are not your money. You cannot 'buy the Sensex' directly, but some mutual funds (called index funds) are designed to copy them."] },
                        { h: "3. What is a mutual fund?", p: ["A mutual fund collects small amounts of money from thousands of people and gives it to a professional fund manager, who invests it in many companies or bonds. In return you receive 'units'. The price of one unit is called NAV (Net Asset Value) and it changes every day.", "Because your money is spread across many companies, a mutual fund is usually less risky than putting everything into one share. It is not risk-free, though. The main types are:"], ul: ["<strong>Equity funds:</strong> invest mostly in shares. Higher risk, higher possible growth over many years.", "<strong>Debt funds:</strong> invest mostly in bonds and lending. Usually lower risk and lower growth.", "<strong>Index funds:</strong> copy Nifty or Sensex. Simple, and the yearly charges are usually low.", "<strong>Hybrid funds:</strong> a mix of shares and bonds."] },
                        { h: "4. What is a SIP?", p: ["SIP means Systematic Investment Plan. You choose a fixed amount (many funds allow it from as little as ₹100 to ₹500 a month) and it is invested automatically on a fixed date every month. With most funds you can pause or stop it at any time.", "A SIP builds a habit. When prices are low your money buys more units, and when prices are high it buys fewer units, so you do not have to guess the 'right day' to invest. This is called rupee-cost averaging."] },
                        { h: "5. Understand the risk", ul: ["Markets can fall, sometimes a lot and sometimes for a long time. Returns are never guaranteed.", "Equity investing is meant for long goals, usually 5 years or more. Money you need within 1 to 3 years (fees, rent, a wedding, hospital costs) should not be in the market.", "Never borrow money to invest.", "Past returns do not promise future returns."] },
                        { h: "6. Before you start: a simple checklist", ul: ["Build an emergency fund first: about 3 to 6 months of basic expenses in a savings account.", "Complete KYC (PAN, Aadhaar, bank account, photo). It is a one-time process.", "Use only SEBI-registered platforms and fund houses. You can check this on the official SEBI website.", "Read the fund's name, category and risk label (called the Riskometer) before you invest.", "Start small, stay regular, and review once or twice a year, not every day."] },
                        { h: "7. Golden safety rules against fraud", ul: ["Never join WhatsApp, Telegram or Instagram groups that promise 'double money in 7 days', 'guaranteed profit' or 'insider tips'. No genuine investment can guarantee returns.", "Never share your OTP, PIN or password with anyone, even someone who says they are from a bank or broker.", "Do not install apps sent by strangers. Use only the official app store.", "If someone pressures you to 'invest today or lose the chance', stop. That is a classic fraud sign.", "Report cyber fraud on the national helpline 1930 or at cybercrime.gov.in."] },
                        { h: "Quick glossary", ul: ["<strong>SEBI:</strong> the government regulator of the securities market.", "<strong>NAV:</strong> the price of one mutual fund unit.", "<strong>AMC:</strong> Asset Management Company, the company that runs the fund.", "<strong>KYC:</strong> Know Your Customer, the one-time identity check.", "<strong>Index:</strong> a scoreboard of a group of companies, like Sensex or Nifty."], note: "Note: This guide is general education only. It is not investment advice. For personal decisions, please speak to a SEBI-registered adviser." }
                    ],
                    hi: [
                        { h: "1. शेयर बाज़ार क्या है?", p: ["किसी कंपनी को बढ़ने के लिए पैसों की ज़रूरत होती है। इसके लिए वह अपनी मालिकाना हिस्सेदारी को छोटे-छोटे टुकड़ों में बाँटती है, जिन्हें शेयर कहते हैं, और आम लोगों को बेचती है। शेयर खरीदने का मतलब है उस कंपनी के एक छोटे हिस्से के मालिक बनना। भारत में शेयर मुख्य रूप से दो एक्सचेंजों पर खरीदे-बेचे जाते हैं: BSE (बॉम्बे स्टॉक एक्सचेंज) और NSE (नेशनल स्टॉक एक्सचेंज)। बाज़ार की निगरानी SEBI नाम की सरकारी संस्था करती है, जो आम निवेशकों की सुरक्षा के लिए नियम बनाती है।", "शेयरों के दाम रोज़ ऊपर-नीचे होते हैं। यह कंपनी के प्रदर्शन, खरीदने-बेचने वालों की संख्या और अर्थव्यवस्था की खबरों पर निर्भर करता है। इसीलिए बिना समझे निवेश करना शुरुआत करने वालों के लिए जोखिम भरा हो सकता है।"] },
                        { h: "2. Sensex और Nifty क्या हैं?", p: ["पूरे बाज़ार का एक स्कोरबोर्ड सोचिए। Sensex, BSE की 30 बड़ी और जानी-मानी कंपनियों को ट्रैक करता है। Nifty 50, NSE की 50 बड़ी कंपनियों को ट्रैक करता है। जब खबर आती है कि 'Sensex 400 अंक चढ़ा', तो इसका मतलब है कि वे बड़ी कंपनियाँ मिलाकर उस दिन अधिक मूल्यवान हुईं।", "ध्यान रखें: Sensex और Nifty सिर्फ़ स्कोरबोर्ड हैं। ये न कोई कंपनी हैं और न आपका पैसा। आप सीधे 'Sensex खरीद' नहीं सकते, लेकिन कुछ म्यूचुअल फंड (जिन्हें इंडेक्स फंड कहते हैं) इन्हें कॉपी करने के लिए बनाए गए हैं।"] },
                        { h: "3. म्यूचुअल फंड क्या है?", p: ["म्यूचुअल फंड हज़ारों लोगों से छोटी-छोटी रकम इकट्ठा करता है और एक पेशेवर फंड मैनेजर को देता है, जो उसे कई कंपनियों या बॉन्ड में निवेश करता है। बदले में आपको 'यूनिट' मिलती हैं। एक यूनिट की कीमत को NAV (नेट एसेट वैल्यू) कहते हैं और यह रोज़ बदलती है।", "आपका पैसा कई कंपनियों में बँटा होने से म्यूचुअल फंड में आमतौर पर एक ही शेयर में सब कुछ लगाने से कम जोखिम होता है। लेकिन यह जोखिम-मुक्त नहीं है। मुख्य प्रकार:"], ul: ["<strong>इक्विटी फंड:</strong> ज़्यादातर शेयरों में निवेश। जोखिम ज़्यादा, कई वर्षों में बढ़त की संभावना भी ज़्यादा।", "<strong>डेट फंड:</strong> ज़्यादातर बॉन्ड और उधार में निवेश। आमतौर पर जोखिम और बढ़त दोनों कम।", "<strong>इंडेक्स फंड:</strong> Nifty या Sensex की नकल करते हैं। सरल, और सालाना खर्च आमतौर पर कम।", "<strong>हाइब्रिड फंड:</strong> शेयर और बॉन्ड का मिश्रण।"] },
                        { h: "4. SIP क्या है?", p: ["SIP यानी सिस्टमैटिक इन्वेस्टमेंट प्लान। आप एक तय रकम चुनते हैं (कई फंड में ₹100 से ₹500 प्रति माह तक से शुरुआत हो सकती है) और वह हर महीने तय तारीख को अपने आप निवेश हो जाती है। ज़्यादातर फंड में आप इसे कभी भी रोक या बंद कर सकते हैं।", "SIP से बचत की आदत बनती है। दाम कम होने पर आपके पैसे से ज़्यादा यूनिट आती हैं और दाम ज़्यादा होने पर कम। इसलिए 'सही दिन' का अंदाज़ा लगाने की ज़रूरत नहीं पड़ती। इसे रुपी-कॉस्ट एवरेजिंग कहते हैं।"] },
                        { h: "5. जोखिम को समझें", ul: ["बाज़ार गिर सकता है, कभी बहुत और कभी लंबे समय तक। रिटर्न की कोई गारंटी नहीं होती।", "इक्विटी निवेश लंबे लक्ष्यों के लिए है, आमतौर पर 5 साल या उससे ज़्यादा। जिस पैसे की 1 से 3 साल में ज़रूरत हो (फीस, किराया, शादी, अस्पताल) उसे बाज़ार में न लगाएँ।", "निवेश के लिए कभी कर्ज़ न लें।", "पिछला रिटर्न भविष्य के रिटर्न की गारंटी नहीं है।"] },
                        { h: "6. शुरू करने से पहले: आसान चेकलिस्ट", ul: ["पहले आपातकालीन फंड बनाएँ: बचत खाते में 3 से 6 महीने के बुनियादी खर्च जितना पैसा।", "KYC पूरा करें (PAN, आधार, बैंक खाता, फोटो)। यह एक बार की प्रक्रिया है।", "सिर्फ़ SEBI-पंजीकृत प्लेटफ़ॉर्म और फंड हाउस का उपयोग करें। इसे SEBI की आधिकारिक वेबसाइट पर जाँच सकते हैं।", "निवेश से पहले फंड का नाम, श्रेणी और रिस्क लेबल (रिस्कोमीटर) पढ़ें।", "छोटी शुरुआत करें, नियमित रहें और साल में एक-दो बार समीक्षा करें, रोज़ नहीं।"] },
                        { h: "7. धोखाधड़ी से बचने के सुनहरे नियम", ul: ["'7 दिन में पैसा डबल', 'पक्का मुनाफ़ा' या 'इनसाइडर टिप्स' का वादा करने वाले WhatsApp, Telegram या Instagram ग्रुप से दूर रहें। कोई भी असली निवेश रिटर्न की गारंटी नहीं दे सकता।", "अपना OTP, PIN या पासवर्ड किसी को न बताएँ, चाहे वह खुद को बैंक या ब्रोकर का बताए।", "अजनबियों द्वारा भेजे गए ऐप इंस्टॉल न करें। केवल आधिकारिक ऐप स्टोर का उपयोग करें।", "अगर कोई कहे 'आज ही लगाओ वरना मौका चला जाएगा', तो रुक जाएँ। यह धोखाधड़ी की पुरानी निशानी है।", "साइबर ठगी की शिकायत राष्ट्रीय हेल्पलाइन 1930 पर या cybercrime.gov.in पर करें।"] },
                        { h: "छोटी शब्दावली", ul: ["<strong>SEBI:</strong> प्रतिभूति बाज़ार की सरकारी नियामक संस्था।", "<strong>NAV:</strong> म्यूचुअल फंड की एक यूनिट की कीमत।", "<strong>AMC:</strong> एसेट मैनेजमेंट कंपनी, जो फंड चलाती है।", "<strong>KYC:</strong> नो योर कस्टमर, पहचान की एक बार की जाँच।", "<strong>इंडेक्स:</strong> कंपनियों के समूह का स्कोरबोर्ड, जैसे Sensex या Nifty।"], note: "नोट: यह मार्गदर्शिका केवल सामान्य शिक्षा के लिए है, निवेश सलाह नहीं। निजी निर्णय के लिए कृपया SEBI-पंजीकृत सलाहकार से बात करें।" }
                    ],
                    mr: [
                        { h: "1. शेअर बाजार म्हणजे काय?", p: ["कंपनीला वाढण्यासाठी पैशांची गरज असते. त्यासाठी ती आपली मालकी लहान लहान तुकड्यांत वाटते, त्यांना शेअर म्हणतात, आणि सर्वसामान्य लोकांना विकते. शेअर घेणे म्हणजे त्या कंपनीच्या एका छोट्या भागाचे मालक होणे. भारतात शेअर्सची खरेदी-विक्री प्रामुख्याने दोन एक्सचेंजवर होते: BSE (बॉम्बे स्टॉक एक्सचेंज) आणि NSE (नॅशनल स्टॉक एक्सचेंज). बाजारावर SEBI ही सरकारी नियामक संस्था लक्ष ठेवते आणि सामान्य गुंतवणूकदारांच्या संरक्षणासाठी नियम बनवते.", "शेअर्सचे भाव रोज वर-खाली होतात. कंपनीची कामगिरी, खरेदी-विक्री करणाऱ्यांची संख्या आणि अर्थव्यवस्थेच्या बातम्या यांवर ते अवलंबून असतात. म्हणूनच समजून न घेता गुंतवणूक करणे नवशिक्यांसाठी धोकादायक ठरू शकते."] },
                        { h: "2. Sensex आणि Nifty म्हणजे काय?", p: ["संपूर्ण बाजाराचा एक स्कोअरबोर्ड कल्पना करा. Sensex हा BSE वरील 30 मोठ्या आणि सुप्रसिद्ध कंपन्यांचा मागोवा घेतो. Nifty 50 हा NSE वरील 50 मोठ्या कंपन्यांचा मागोवा घेतो. बातमीत 'Sensex 400 अंकांनी वाढला' असे ऐकले की याचा अर्थ त्या मोठ्या कंपन्यांचे एकत्रित मूल्य त्या दिवशी वाढले.", "लक्षात ठेवा: Sensex आणि Nifty हे फक्त स्कोअरबोर्ड आहेत. ती कंपनी नाही आणि तुमचे पैसेही नाहीत. तुम्ही थेट 'Sensex विकत घेऊ' शकत नाही, पण काही म्युच्युअल फंड (ज्यांना इंडेक्स फंड म्हणतात) त्यांची नक्कल करण्यासाठी बनवलेले असतात."] },
                        { h: "3. म्युच्युअल फंड म्हणजे काय?", p: ["म्युच्युअल फंड हजारो लोकांकडून लहान लहान रक्कम गोळा करतो आणि ती एका व्यावसायिक फंड मॅनेजरकडे देतो. तो ती अनेक कंपन्या किंवा बाँड्समध्ये गुंतवतो. त्या बदल्यात तुम्हाला 'युनिट्स' मिळतात. एका युनिटच्या किमतीला NAV (नेट असेट व्हॅल्यू) म्हणतात आणि ती रोज बदलते.", "तुमचे पैसे अनेक कंपन्यांत विभागले जात असल्याने म्युच्युअल फंडात सहसा एकाच शेअरमध्ये सर्व पैसे टाकण्यापेक्षा कमी धोका असतो. पण तो धोकामुक्त नसतो. मुख्य प्रकार:"], ul: ["<strong>इक्विटी फंड:</strong> प्रामुख्याने शेअर्समध्ये गुंतवणूक. धोका जास्त, अनेक वर्षांत वाढीची शक्यताही जास्त.", "<strong>डेट फंड:</strong> प्रामुख्याने बाँड्स आणि कर्जात गुंतवणूक. सहसा धोका आणि वाढ दोन्ही कमी.", "<strong>इंडेक्स फंड:</strong> Nifty किंवा Sensex ची नक्कल करतात. सोपे, आणि वार्षिक खर्च सहसा कमी.", "<strong>हायब्रिड फंड:</strong> शेअर्स आणि बाँड्सचे मिश्रण."] },
                        { h: "4. SIP म्हणजे काय?", p: ["SIP म्हणजे सिस्टिमॅटिक इन्व्हेस्टमेंट प्लॅन. तुम्ही ठरावीक रक्कम निवडता (अनेक फंडांत ₹100 ते ₹500 दरमहापासून सुरुवात करता येते) आणि ती दर महिन्याच्या ठरलेल्या तारखेला आपोआप गुंतवली जाते. बहुतेक फंडांत तुम्ही ती केव्हाही थांबवू किंवा बंद करू शकता.", "SIP मुळे बचतीची सवय लागते. भाव कमी असताना तुमच्या पैशांत जास्त युनिट्स येतात आणि भाव जास्त असताना कमी. त्यामुळे 'योग्य दिवस' ओळखण्याची गरज पडत नाही. याला रुपी-कॉस्ट अॅव्हरेजिंग म्हणतात."] },
                        { h: "5. धोका समजून घ्या", ul: ["बाजार पडू शकतो, कधी खूप आणि कधी बराच काळ. परताव्याची कधीही हमी नसते.", "इक्विटी गुंतवणूक दीर्घकालीन उद्दिष्टांसाठी आहे, सहसा 5 वर्षे किंवा त्याहून अधिक. 1 ते 3 वर्षांत लागणारे पैसे (फी, भाडे, लग्न, दवाखाना) बाजारात गुंतवू नका.", "गुंतवणुकीसाठी कधीही कर्ज काढू नका.", "भूतकाळातील परतावा भविष्यातील परताव्याची हमी देत नाही."] },
                        { h: "6. सुरू करण्यापूर्वी: सोपी चेकलिस्ट", ul: ["आधी आपत्कालीन निधी तयार करा: बचत खात्यात 3 ते 6 महिन्यांच्या मूलभूत खर्चाइतके पैसे.", "KYC पूर्ण करा (PAN, आधार, बँक खाते, फोटो). ही एकदाच करायची प्रक्रिया आहे.", "फक्त SEBI-नोंदणीकृत प्लॅटफॉर्म आणि फंड हाऊस वापरा. हे SEBI च्या अधिकृत वेबसाइटवर तपासता येते.", "गुंतवणुकीपूर्वी फंडाचे नाव, श्रेणी आणि रिस्क लेबल (रिस्कोमीटर) वाचा.", "लहान सुरुवात करा, नियमित राहा आणि वर्षातून एक-दोनदा आढावा घ्या, रोज नाही."] },
                        { h: "7. फसवणुकीपासून वाचण्याचे सुवर्ण नियम", ul: ["'7 दिवसांत पैसे दुप्पट', 'खात्रीशीर नफा' किंवा 'इनसायडर टिप्स' असे सांगणाऱ्या WhatsApp, Telegram किंवा Instagram ग्रुपपासून दूर राहा. कोणतीही खरी गुंतवणूक परताव्याची हमी देऊ शकत नाही.", "तुमचा OTP, PIN किंवा पासवर्ड कोणालाही सांगू नका, मग तो स्वतःला बँक किंवा ब्रोकरचा माणूस म्हणवत असला तरी.", "अनोळखी लोकांनी पाठवलेले अॅप इन्स्टॉल करू नका. फक्त अधिकृत अॅप स्टोअर वापरा.", "कोणी 'आजच गुंतवा नाहीतर संधी जाईल' असा दबाव आणत असेल तर थांबा. ही फसवणुकीची जुनी खूण आहे.", "सायबर फसवणुकीची तक्रार राष्ट्रीय हेल्पलाइन 1930 वर किंवा cybercrime.gov.in वर करा."] },
                        { h: "छोटी शब्दावली", ul: ["<strong>SEBI:</strong> शेअर बाजाराची सरकारी नियामक संस्था.", "<strong>NAV:</strong> म्युच्युअल फंडाच्या एका युनिटची किंमत.", "<strong>AMC:</strong> अॅसेट मॅनेजमेंट कंपनी, जी फंड चालवते.", "<strong>KYC:</strong> नो युअर कस्टमर, ओळखीची एकदाच करायची तपासणी.", "<strong>इंडेक्स:</strong> कंपन्यांच्या गटाचा स्कोअरबोर्ड, जसे Sensex किंवा Nifty."], note: "टीप: ही मार्गदर्शिका फक्त सामान्य शिक्षणासाठी आहे, गुंतवणूक सल्ला नाही. वैयक्तिक निर्णयासाठी कृपया SEBI-नोंदणीकृत सल्लागाराशी बोला." }
                    ]
                },
                "exam-memory": {
                    en: [
                        { h: "1. Why re-reading does not work", p: ["Most students study by reading the same page again and again, or by highlighting. It feels productive because the page starts to look familiar. But 'looking familiar' is not the same as 'I can remember it'. In the exam hall the page is not in front of you, so your brain must pull the answer out on its own."] },
                        { h: "2. What is active recall?", p: ["Active recall means testing yourself instead of re-reading. You close the book and try to bring the answer out of your memory. The effort of searching for the answer is exactly what makes the memory stronger. Research on learning has repeatedly found that self-testing works better than re-reading for long-term memory."] },
                        { h: "3. The 5-step method", ul: ["<strong>Step 1:</strong> Read one small topic once, slowly (10 to 15 minutes).", "<strong>Step 2:</strong> Close the book. On a blank page write or say everything you remember. Do not peek.", "<strong>Step 3:</strong> Open the book and check. With a different colour pen, add what you missed.", "<strong>Step 4:</strong> Turn the missed points into questions, for example 'What are the 4 strokes of a petrol engine?' Write the question on one side of a small card and the answer on the other.", "<strong>Step 5:</strong> Repeat the cards using the schedule below."] },
                        { h: "4. Spaced repetition: when to review", p: ["Memory fades quickly if you never revisit it, and it fades more slowly each time you review. So review at growing gaps:"], ul: ["<strong>Day 1:</strong> first study", "<strong>Day 2:</strong> quick recall", "<strong>Day 4 to 7:</strong> recall again", "<strong>Day 14:</strong> recall again", "<strong>Day 30:</strong> final recall before the exam"] },
                        { p: ["Each review should take only 5 to 10 minutes, because you are only testing yourself, not learning again from the start."] },
                        { h: "5. Teach it to someone (the Feynman method)", p: ["Pick a topic and explain it aloud in simple words, as if you are teaching a younger brother or sister. Wherever you get stuck, or use big words you cannot explain, that is the gap in your understanding. Go back, fix it, and explain again."] },
                        { h: "6. Use past papers and mix subjects", ul: ["Solve previous year question papers within the real time limit. This trains both memory and speed.", "Mix topics in one session (for example 25 minutes of Maths, then 25 minutes of Theory) instead of one subject for 4 hours.", "Keep a 'mistakes notebook'. Write each wrong answer with the correct one. Read it again before the exam."] },
                        { h: "7. Protect your brain", ul: ["Study in blocks of 25 minutes with a 5-minute break (the Pomodoro method).", "Sleep 7 to 8 hours. Memory is stored during sleep, so an all-night session before the exam usually backfires.", "Drink water, eat on time and take a short walk. Keep your phone in another room while you study."] },
                        { h: "8. A simple weekly plan", ul: ["<strong>Monday to Friday:</strong> 2 to 3 study blocks a day, each ending with 5 minutes of active recall.", "<strong>Saturday:</strong> recall all the cards of the week and solve one past paper.", "<strong>Sunday:</strong> light revision of the mistakes notebook, and rest."], note: "Remember: one hour of study with recall is better than three hours of only reading." }
                    ],
                    hi: [
                        { h: "1. बार-बार पढ़ना क्यों काम नहीं करता?", p: ["ज़्यादातर विद्यार्थी एक ही पन्ने को बार-बार पढ़कर या हाइलाइट करके पढ़ाई करते हैं। यह फ़ायदेमंद लगता है क्योंकि पन्ना जाना-पहचाना लगने लगता है। लेकिन 'जाना-पहचाना लगना' और 'मुझे याद है' एक बात नहीं है। परीक्षा हॉल में पन्ना आपके सामने नहीं होता, इसलिए दिमाग को जवाब खुद निकालना पड़ता है।"] },
                        { h: "2. एक्टिव रिकॉल क्या है?", p: ["एक्टिव रिकॉल यानी दोबारा पढ़ने की जगह खुद की परीक्षा लेना। आप किताब बंद करके याद से जवाब निकालने की कोशिश करते हैं। जवाब ढूँढ़ने की यही मेहनत याददाश्त को मज़बूत बनाती है। सीखने पर हुए शोध बार-बार यह बताते हैं कि लंबे समय तक याद रखने के लिए खुद को जाँचना, दोबारा पढ़ने से बेहतर है।"] },
                        { h: "3. 5 कदम की विधि", ul: ["<strong>कदम 1:</strong> एक छोटा टॉपिक धीरे-धीरे एक बार पढ़ें (10 से 15 मिनट)।", "<strong>कदम 2:</strong> किताब बंद करें। खाली पन्ने पर जो-जो याद है लिखें या बोलें। झाँकें नहीं।", "<strong>कदम 3:</strong> किताब खोलकर जाँचें। जो छूट गया, उसे दूसरे रंग के पेन से जोड़ें।", "<strong>कदम 4:</strong> छूटे हुए बिंदुओं को सवाल बनाएँ, जैसे 'पेट्रोल इंजन के 4 स्ट्रोक कौन-से हैं?' छोटे कार्ड के एक तरफ़ सवाल और दूसरी तरफ़ जवाब लिखें।", "<strong>कदम 5:</strong> नीचे दिए कार्यक्रम के अनुसार कार्ड दोहराएँ।"] },
                        { h: "4. स्पेस्ड रिपीटिशन: कब दोहराएँ", p: ["अगर आप कभी नहीं दोहराते तो याददाश्त जल्दी मिट जाती है, और हर दोहराव के बाद वह धीमे मिटती है। इसलिए बढ़ते अंतराल पर दोहराएँ:"], ul: ["<strong>दिन 1:</strong> पहली बार पढ़ाई", "<strong>दिन 2:</strong> जल्दी से रिकॉल", "<strong>दिन 4 से 7:</strong> फिर रिकॉल", "<strong>दिन 14:</strong> फिर रिकॉल", "<strong>दिन 30:</strong> परीक्षा से पहले अंतिम रिकॉल"] },
                        { p: ["हर दोहराव में सिर्फ़ 5 से 10 मिनट लगने चाहिए, क्योंकि आप सिर्फ़ खुद को जाँच रहे हैं, शुरू से दोबारा नहीं सीख रहे।"] },
                        { h: "5. किसी को सिखाएँ (फाइनमैन विधि)", p: ["कोई टॉपिक चुनें और उसे सरल शब्दों में ज़ोर से समझाएँ, जैसे अपने छोटे भाई या बहन को पढ़ा रहे हों। जहाँ आप अटकें या ऐसे बड़े शब्द बोलें जिन्हें समझा न सकें, वहीं आपकी समझ में कमी है। वापस जाएँ, उसे ठीक करें और फिर समझाएँ।"] },
                        { h: "6. पुराने प्रश्नपत्र हल करें और विषय मिलाकर पढ़ें", ul: ["पिछले वर्षों के प्रश्नपत्र असली समय-सीमा में हल करें। इससे याददाश्त और गति दोनों बढ़ती हैं।", "एक सत्र में विषय मिलाएँ (जैसे 25 मिनट गणित, फिर 25 मिनट थ्योरी), 4 घंटे तक एक ही विषय नहीं।", "'गलतियों की कॉपी' रखें। हर गलत जवाब सही जवाब के साथ लिखें। परीक्षा से पहले उसे फिर पढ़ें।"] },
                        { h: "7. अपने दिमाग का ख्याल रखें", ul: ["25 मिनट के ब्लॉक में पढ़ें और 5 मिनट का ब्रेक लें (पोमोडोरो विधि)।", "7 से 8 घंटे सोएँ। याददाश्त नींद में पक्की होती है, इसलिए परीक्षा से पहले पूरी रात जागना अक्सर उल्टा पड़ता है।", "पानी पिएँ, समय पर खाएँ और थोड़ी सैर करें। पढ़ते समय फ़ोन दूसरे कमरे में रखें।"] },
                        { h: "8. साप्ताहिक योजना", ul: ["<strong>सोमवार से शुक्रवार:</strong> रोज़ 2 से 3 पढ़ाई ब्लॉक, हर एक के अंत में 5 मिनट एक्टिव रिकॉल।", "<strong>शनिवार:</strong> पूरे हफ़्ते के सारे कार्ड दोहराएँ और एक पुराना प्रश्नपत्र हल करें।", "<strong>रविवार:</strong> गलतियों की कॉपी का हल्का रिविज़न और आराम।"], note: "याद रखें: सिर्फ़ तीन घंटे पढ़ने से बेहतर है एक घंटा रिकॉल के साथ पढ़ना।" }
                    ],
                    mr: [
                        { h: "1. पुन्हा पुन्हा वाचणे का उपयोगी नाही?", p: ["बहुतेक विद्यार्थी एकच पान पुन्हा पुन्हा वाचून किंवा हायलाइट करून अभ्यास करतात. ते फायद्याचे वाटते कारण पान ओळखीचे वाटू लागते. पण 'ओळखीचे वाटणे' आणि 'मला आठवते' हे एकच नाही. परीक्षेच्या हॉलमध्ये पान समोर नसते, म्हणून मेंदूला उत्तर स्वतःच बाहेर काढावे लागते."] },
                        { h: "2. अॅक्टिव्ह रिकॉल म्हणजे काय?", p: ["अॅक्टिव्ह रिकॉल म्हणजे पुन्हा वाचण्याऐवजी स्वतःची परीक्षा घेणे. तुम्ही पुस्तक बंद करून आठवणीतून उत्तर काढण्याचा प्रयत्न करता. उत्तर शोधण्याचा हाच प्रयत्न स्मरणशक्ती घट्ट करतो. शिकण्यावरील संशोधनात वारंवार दिसून आले आहे की दीर्घकाळ लक्षात ठेवण्यासाठी स्वतःची चाचणी घेणे हे पुन्हा वाचण्यापेक्षा चांगले आहे."] },
                        { h: "3. 5 पायऱ्यांची पद्धत", ul: ["<strong>पायरी 1:</strong> एक छोटा टॉपिक हळूहळू एकदा वाचा (10 ते 15 मिनिटे).", "<strong>पायरी 2:</strong> पुस्तक बंद करा. कोऱ्या पानावर जे आठवते ते लिहा किंवा बोला. डोकावू नका.", "<strong>पायरी 3:</strong> पुस्तक उघडून तपासा. जे राहिले ते वेगळ्या रंगाच्या पेनाने जोडा.", "<strong>पायरी 4:</strong> राहिलेल्या मुद्द्यांचे प्रश्न बनवा, उदा. 'पेट्रोल इंजिनचे 4 स्ट्रोक कोणते?' छोट्या कार्डाच्या एका बाजूला प्रश्न आणि दुसऱ्या बाजूला उत्तर लिहा.", "<strong>पायरी 5:</strong> खालील वेळापत्रकानुसार कार्ड्सची उजळणी करा."] },
                        { h: "4. स्पेस्ड रिपीटिशन: कधी उजळणी करायची", p: ["उजळणी न केल्यास स्मरणशक्ती लवकर कमी होते, आणि प्रत्येक उजळणीनंतर ती हळू कमी होते. म्हणून वाढत्या अंतराने उजळणी करा:"], ul: ["<strong>दिवस 1:</strong> पहिला अभ्यास", "<strong>दिवस 2:</strong> झटपट रिकॉल", "<strong>दिवस 4 ते 7:</strong> पुन्हा रिकॉल", "<strong>दिवस 14:</strong> पुन्हा रिकॉल", "<strong>दिवस 30:</strong> परीक्षेपूर्वी शेवटचा रिकॉल"] },
                        { p: ["प्रत्येक उजळणीला फक्त 5 ते 10 मिनिटे लागावीत, कारण तुम्ही फक्त स्वतःची चाचणी घेत आहात, पुन्हा सुरुवातीपासून शिकत नाही."] },
                        { h: "5. दुसऱ्याला शिकवा (फाइनमन पद्धत)", p: ["एखादा टॉपिक निवडा आणि तो सोप्या शब्दांत मोठ्याने समजावून सांगा, जणू तुम्ही लहान भावंडाला शिकवत आहात. जिथे तुम्ही अडखळता किंवा समजावता न येणारे मोठे शब्द वापरता, तिथेच तुमच्या समजुतीत कमतरता आहे. परत जा, ती दुरुस्त करा आणि पुन्हा समजावून सांगा."] },
                        { h: "6. जुन्या प्रश्नपत्रिका सोडवा आणि विषय मिसळा", ul: ["मागील वर्षांच्या प्रश्नपत्रिका खऱ्या वेळेच्या मर्यादेत सोडवा. यामुळे स्मरणशक्ती आणि वेग दोन्ही वाढतात.", "एका सत्रात विषय मिसळा (उदा. 25 मिनिटे गणित, मग 25 मिनिटे थिअरी), 4 तास एकच विषय नको.", "'चुकांची वही' ठेवा. प्रत्येक चुकीचे उत्तर बरोबर उत्तरासोबत लिहा. परीक्षेपूर्वी ती पुन्हा वाचा."] },
                        { h: "7. तुमच्या मेंदूची काळजी घ्या", ul: ["25 मिनिटांच्या ब्लॉकमध्ये अभ्यास करा आणि 5 मिनिटांचा ब्रेक घ्या (पोमोडोरो पद्धत).", "7 ते 8 तास झोपा. स्मरणशक्ती झोपेत पक्की होते, म्हणून परीक्षेपूर्वी रात्रभर जागणे बहुधा उलटे पडते.", "पाणी प्या, वेळेवर जेवा आणि थोडे चाला. अभ्यास करताना फोन दुसऱ्या खोलीत ठेवा."] },
                        { h: "8. साप्ताहिक वेळापत्रक", ul: ["<strong>सोमवार ते शुक्रवार:</strong> रोज 2 ते 3 अभ्यास ब्लॉक, प्रत्येकाच्या शेवटी 5 मिनिटे अॅक्टिव्ह रिकॉल.", "<strong>शनिवार:</strong> आठवडाभराचे सर्व कार्ड्स उजळा आणि एक जुनी प्रश्नपत्रिका सोडवा.", "<strong>रविवार:</strong> चुकांच्या वहीची हलकी उजळणी आणि विश्रांती."], note: "लक्षात ठेवा: फक्त तीन तास वाचण्यापेक्षा रिकॉलसह एक तास अभ्यास चांगला." }
                    ]
                },
                "email-etiquette": {
                    en: [
                        { h: "1. Why email matters", p: ["Whether you apply for a job, an apprenticeship, or write to your college principal, your email is often the first impression. A clear, polite email shows that you are serious and respectful, even before anyone meets you."] },
                        { h: "2. Start with a professional email ID", ul: ["Use your real name, for example rahul.patil@gmail.com. Avoid IDs like cool_boy_007 or darklord99.", "Set a proper display name (Rahul Patil), not a nickname."] },
                        { h: "3. The 6 parts of a good email", ul: ["<strong>Subject line:</strong> short and specific. Good: 'Application for Computer Operator – Rahul Patil'. Bad: 'Hello' or 'Urgent!!!'", "<strong>Greeting:</strong> 'Dear Sir/Madam,' or 'Dear Mr. Sharma,' (use the person's name if you know it).", "<strong>Opening line:</strong> say who you are and why you are writing, in one sentence.", "<strong>Body:</strong> 2 to 4 short sentences or a few clear points. One email, one topic.", "<strong>Closing line:</strong> say what you want next, for example 'I would be grateful for an opportunity to meet.' Then 'Thank you.'", "<strong>Signature:</strong> 'Regards,' your full name, phone number, and course or city."] },
                        { h: "4. Sample 1: Job application", sample: "Subject: Application for Data Entry Operator – Rahul Patil\n\nDear Sir/Madam,\n\nI am Rahul Patil, a COPA (Computer Operator and Programming Assistant) student from an ITI in Nashik. I am writing to apply for the Data Entry Operator position advertised on your website.\n\nI can type in English and Marathi, and I know MS Word, Excel and basic internet tools. My resume is attached for your reference.\n\nI would be grateful for an opportunity to meet or to take a short test. Thank you for your time.\n\nRegards,\nRahul Patil\nPhone: 98XXXXXXXX\nNashik" },
                        { h: "5. Sample 2: Leave request to a teacher", sample: "Subject: Leave Request for 12 and 13 March – Rahul Patil, COPA 2nd Year\n\nDear Sir/Madam,\n\nI would like to request leave on 12 and 13 March because of a family function. I will complete the missed practical work and notes after I return.\n\nKindly grant me leave. Thank you.\n\nRegards,\nRahul Patil\nCOPA 2nd Year, Roll No. 24" },
                        { h: "6. Attachments", ul: ["Name files clearly: Rahul_Patil_Resume.pdf, not 'resume final final2.docx'.", "Send resumes as PDF so the layout does not break.", "Mention the attachment in the email body so the reader does not miss it.", "Keep the total size under about 10 MB."] },
                        { h: "7. Do's and Don'ts", ul: ["<strong>Do</strong> proofread once for spelling and names before pressing Send.", "<strong>Do</strong> reply within 1 to 2 working days.", "<strong>Do</strong> use CC only for people who must know. Use BCC when you do not want to show others' addresses.", "<strong>Don't</strong> write in ALL CAPS. It looks like shouting.", "<strong>Don't</strong> use SMS-style language (u, pls, thx) or too many emojis.", "<strong>Don't</strong> forward private emails without permission."] },
                        { h: "8. Follow up politely", p: ["If you hear nothing for 5 to 7 days, send one short reminder in the same email thread:"], sample: "Dear Sir/Madam,\n\nI am following up on my application sent on 10 March. Please let me know if you need any more details.\n\nThank you.\nRahul Patil", note: "Tip: Read your email aloud once. If it sounds polite and clear when you say it, it will read the same way." }
                    ],
                    hi: [
                        { h: "1. ईमेल क्यों ज़रूरी है?", p: ["चाहे आप नौकरी या अप्रेंटिसशिप के लिए आवेदन करें या कॉलेज के प्राचार्य को पत्र लिखें, आपका ईमेल अक्सर पहली छाप होता है। साफ़ और विनम्र ईमेल दिखाता है कि आप गंभीर और सम्मानजनक हैं, किसी के मिलने से पहले ही।"] },
                        { h: "2. प्रोफ़ेशनल ईमेल ID से शुरुआत करें", ul: ["अपना असली नाम इस्तेमाल करें, जैसे rahul.patil@gmail.com। cool_boy_007 या darklord99 जैसी ID से बचें।", "डिस्प्ले नाम सही रखें (Rahul Patil), कोई उपनाम नहीं।"] },
                        { h: "3. अच्छे ईमेल के 6 हिस्से", ul: ["<strong>सब्जेक्ट लाइन:</strong> छोटी और स्पष्ट। अच्छा: 'Application for Computer Operator – Rahul Patil'। बुरा: 'Hello' या 'Urgent!!!'", "<strong>अभिवादन:</strong> 'Dear Sir/Madam,' या 'Dear Mr. Sharma,' (नाम पता हो तो नाम लिखें)।", "<strong>शुरुआती पंक्ति:</strong> एक वाक्य में बताएँ कि आप कौन हैं और क्यों लिख रहे हैं।", "<strong>मुख्य भाग:</strong> 2 से 4 छोटे वाक्य या कुछ साफ़ बिंदु। एक ईमेल, एक विषय।", "<strong>समापन पंक्ति:</strong> बताएँ कि आप आगे क्या चाहते हैं, जैसे 'I would be grateful for an opportunity to meet.' फिर 'Thank you.'", "<strong>सिग्नेचर:</strong> 'Regards,' पूरा नाम, फ़ोन नंबर और कोर्स या शहर।"] },
                        { h: "4. नमूना 1: नौकरी का आवेदन", p: ["ईमेल आमतौर पर अंग्रेज़ी में लिखे जाते हैं, इसलिए नमूने अंग्रेज़ी में हैं:"], sample: "Subject: Application for Data Entry Operator – Rahul Patil\n\nDear Sir/Madam,\n\nI am Rahul Patil, a COPA (Computer Operator and Programming Assistant) student from an ITI in Nashik. I am writing to apply for the Data Entry Operator position advertised on your website.\n\nI can type in English and Marathi, and I know MS Word, Excel and basic internet tools. My resume is attached for your reference.\n\nI would be grateful for an opportunity to meet or to take a short test. Thank you for your time.\n\nRegards,\nRahul Patil\nPhone: 98XXXXXXXX\nNashik" },
                        { h: "5. नमूना 2: शिक्षक को छुट्टी का आवेदन", sample: "Subject: Leave Request for 12 and 13 March – Rahul Patil, COPA 2nd Year\n\nDear Sir/Madam,\n\nI would like to request leave on 12 and 13 March because of a family function. I will complete the missed practical work and notes after I return.\n\nKindly grant me leave. Thank you.\n\nRegards,\nRahul Patil\nCOPA 2nd Year, Roll No. 24" },
                        { h: "6. अटैचमेंट", ul: ["फ़ाइल का नाम साफ़ रखें: Rahul_Patil_Resume.pdf, 'resume final final2.docx' नहीं।", "रिज़्यूमे PDF में भेजें ताकि फ़ॉर्मेट न बिगड़े।", "ईमेल के मुख्य भाग में अटैचमेंट का ज़िक्र करें ताकि पढ़ने वाला उसे न चूके।", "कुल साइज़ लगभग 10 MB से कम रखें।"] },
                        { h: "7. क्या करें और क्या न करें", ul: ["<strong>करें:</strong> Send दबाने से पहले एक बार स्पेलिंग और नाम जाँचें।", "<strong>करें:</strong> 1 से 2 कार्यदिवस में जवाब दें।", "<strong>करें:</strong> CC सिर्फ़ उन्हें लगाएँ जिन्हें जानना ज़रूरी है। दूसरों के पते छिपाने हों तो BCC का उपयोग करें।", "<strong>न करें:</strong> पूरा CAPITAL में न लिखें। यह चिल्लाने जैसा लगता है।", "<strong>न करें:</strong> SMS वाली भाषा (u, pls, thx) या बहुत सारे इमोजी इस्तेमाल न करें।", "<strong>न करें:</strong> निजी ईमेल बिना अनुमति आगे न भेजें।"] },
                        { h: "8. विनम्रता से फ़ॉलो-अप करें", p: ["अगर 5 से 7 दिन तक जवाब न आए तो उसी ईमेल थ्रेड में एक छोटा रिमाइंडर भेजें:"], sample: "Dear Sir/Madam,\n\nI am following up on my application sent on 10 March. Please let me know if you need any more details.\n\nThank you.\nRahul Patil", note: "सुझाव: अपना ईमेल एक बार ज़ोर से पढ़ें। अगर बोलने में विनम्र और साफ़ लगे, तो पढ़ने में भी वैसा ही लगेगा।" }
                    ],
                    mr: [
                        { h: "1. ईमेल का महत्त्वाचा आहे?", p: ["तुम्ही नोकरी किंवा अप्रेंटिसशिपसाठी अर्ज करत असा किंवा कॉलेजच्या प्राचार्यांना पत्र लिहीत असा, तुमचा ईमेल बहुधा पहिली छाप असतो. स्पष्ट आणि नम्र ईमेल दाखवतो की तुम्ही गंभीर आणि आदरशील आहात, कोणी भेटण्यापूर्वीच."] },
                        { h: "2. व्यावसायिक ईमेल ID ने सुरुवात करा", ul: ["तुमचे खरे नाव वापरा, उदा. rahul.patil@gmail.com. cool_boy_007 किंवा darklord99 सारख्या ID टाळा.", "डिस्प्ले नाव नीट ठेवा (Rahul Patil), टोपणनाव नको."] },
                        { h: "3. चांगल्या ईमेलचे 6 भाग", ul: ["<strong>सब्जेक्ट लाइन:</strong> छोटी आणि स्पष्ट. चांगली: 'Application for Computer Operator – Rahul Patil'. वाईट: 'Hello' किंवा 'Urgent!!!'", "<strong>अभिवादन:</strong> 'Dear Sir/Madam,' किंवा 'Dear Mr. Sharma,' (नाव माहीत असल्यास नाव लिहा).", "<strong>सुरुवातीची ओळ:</strong> एका वाक्यात सांगा की तुम्ही कोण आहात आणि का लिहीत आहात.", "<strong>मुख्य भाग:</strong> 2 ते 4 छोटी वाक्ये किंवा काही स्पष्ट मुद्दे. एक ईमेल, एक विषय.", "<strong>समारोपाची ओळ:</strong> पुढे काय हवे ते सांगा, उदा. 'I would be grateful for an opportunity to meet.' मग 'Thank you.'", "<strong>सही (सिग्नेचर):</strong> 'Regards,' पूर्ण नाव, फोन नंबर आणि कोर्स किंवा शहर."] },
                        { h: "4. नमुना 1: नोकरीसाठी अर्ज", p: ["ईमेल सहसा इंग्रजीत लिहितात, म्हणून नमुने इंग्रजीत आहेत:"], sample: "Subject: Application for Data Entry Operator – Rahul Patil\n\nDear Sir/Madam,\n\nI am Rahul Patil, a COPA (Computer Operator and Programming Assistant) student from an ITI in Nashik. I am writing to apply for the Data Entry Operator position advertised on your website.\n\nI can type in English and Marathi, and I know MS Word, Excel and basic internet tools. My resume is attached for your reference.\n\nI would be grateful for an opportunity to meet or to take a short test. Thank you for your time.\n\nRegards,\nRahul Patil\nPhone: 98XXXXXXXX\nNashik" },
                        { h: "5. नमुना 2: शिक्षकांना रजेचा अर्ज", sample: "Subject: Leave Request for 12 and 13 March – Rahul Patil, COPA 2nd Year\n\nDear Sir/Madam,\n\nI would like to request leave on 12 and 13 March because of a family function. I will complete the missed practical work and notes after I return.\n\nKindly grant me leave. Thank you.\n\nRegards,\nRahul Patil\nCOPA 2nd Year, Roll No. 24" },
                        { h: "6. अटॅचमेंट", ul: ["फाइलचे नाव स्पष्ट ठेवा: Rahul_Patil_Resume.pdf, 'resume final final2.docx' नाही.", "रेझ्युमे PDF मध्ये पाठवा, म्हणजे फॉरमॅट बिघडत नाही.", "ईमेलच्या मुख्य भागात अटॅचमेंटचा उल्लेख करा म्हणजे वाचणाऱ्याकडून ती चुकत नाही.", "एकूण साइज सुमारे 10 MB पेक्षा कमी ठेवा."] },
                        { h: "7. काय करावे आणि काय करू नये", ul: ["<strong>करा:</strong> Send दाबण्यापूर्वी एकदा स्पेलिंग आणि नावे तपासा.", "<strong>करा:</strong> 1 ते 2 कामकाजाच्या दिवसांत उत्तर द्या.", "<strong>करा:</strong> CC फक्त ज्यांना माहिती असणे आवश्यक आहे त्यांनाच लावा. इतरांचे पत्ते लपवायचे असतील तर BCC वापरा.", "<strong>करू नका:</strong> सगळे ओरडल्यासारखे CAPITAL मध्ये लिहू नका.", "<strong>करू नका:</strong> SMS सारखी भाषा (u, pls, thx) किंवा खूप इमोजी वापरू नका.", "<strong>करू नका:</strong> खाजगी ईमेल परवानगीशिवाय पुढे पाठवू नका."] },
                        { h: "8. नम्रपणे पाठपुरावा करा", p: ["5 ते 7 दिवस उत्तर आले नाही तर त्याच ईमेल थ्रेडमध्ये एक छोटी आठवण पाठवा:"], sample: "Dear Sir/Madam,\n\nI am following up on my application sent on 10 March. Please let me know if you need any more details.\n\nThank you.\nRahul Patil", note: "सूचना: तुमचा ईमेल एकदा मोठ्याने वाचा. बोलताना तो नम्र आणि स्पष्ट वाटला तर वाचतानाही तसाच वाटेल." }
                    ]
                },
                "elder-digital-peace": {
                    en: [
                        { h: "1. Make the phone comfortable", ul: ["Increase the font size and brightness in Settings.", "Turn on voice typing (the microphone on the keyboard) so you can speak instead of typing. It works in Hindi and Marathi too.", "Keep the volume high and use the speaker or earphones for calls.", "Keep important apps (Phone, WhatsApp, Camera, Gallery) on the first screen.", "Save emergency numbers and close family members with their photos."] },
                        { h: "2. Know the common scams", p: ["Fraudsters target people who are kind and trusting. These are the most common tricks:"], ul: ["<strong>Fake bank or KYC calls and messages:</strong> 'Your account will be blocked, click this link.' Banks never ask for your OTP, PIN, CVV or password.", "<strong>'Digital arrest' or fake police calls:</strong> a caller says you are under arrest, asks you to stay on a video call and pay money. No genuine police or agency arrests anyone over a phone or video call.", "<strong>Lottery, prize and gift messages:</strong> you cannot win a prize in a contest you never entered.", "<strong>'Grandchild in trouble' calls:</strong> a voice says 'I am in trouble, send money, don't tell Papa.' Hang up and call your family member on their usual number.", "<strong>UPI trick:</strong> your UPI PIN is needed only to SEND money. You never need to enter a PIN to RECEIVE money.", "<strong>Fake customer-care numbers</strong> found in search results: always use the number printed on your card or on the official website."] },
                        { h: "3. The 3-second rule", p: ["If a call or message creates fear, hurry or secrecy, stop for three seconds and ask: 'Can I call someone I trust first?' Real problems can wait ten minutes. Scams cannot."] },
                        { h: "4. If something goes wrong", ul: ["Call <strong>1930</strong>, the national cyber-crime helpline, as soon as possible. The first hours matter most.", "Report at <strong>cybercrime.gov.in</strong>.", "Inform your bank and ask them to block the card or UPI.", "Do not feel ashamed. Many educated people get fooled. Tell your family quickly."] },
                        { h: "5. WhatsApp and forwarded messages", ul: ["A message marked 'Forwarded many times' is often false. Do not believe or forward it without checking.", "Health cures, 'free government scheme' links and 'share with 10 people or face bad luck' messages are usually fake.", "Check with a family member or a reliable news source before forwarding.", "Do not click unknown links, and do not scan a QR code to receive money."] },
                        { h: "6. Healthy screen habits", ul: ["<strong>20-20-20 rule:</strong> every 20 minutes, look at something 20 feet away for 20 seconds.", "Keep the phone away at mealtimes and in the last hour before sleep.", "After watching videos, take a short walk. The body needs movement more than a screen.", "Keep the volume low and use earphones to protect your hearing."] },
                        { h: "7. The good side: stay connected", ul: ["Video call grandchildren or relatives once a week.", "Join the family WhatsApp group and share photos.", "Listen to bhajans, kirtan, old songs and news, and learn something new. Many free classes are online.", "Use maps to find a place, and use UPI only with trusted shops."] },
                        { h: "8. For family members: how to help", ul: ["Be patient. Teach one thing at a time and let them press the buttons themselves.", "Write simple steps on paper in big letters.", "Turn on the screen lock, set automatic updates and add an emergency contact.", "Agree on a family code word, so that a real emergency call can be confirmed."], note: "Technology is a tool to make life easier, not something to fear. Go slowly, ask questions, and never let anyone rush you." }
                    ],
                    hi: [
                        { h: "1. फ़ोन को आरामदायक बनाएँ", ul: ["सेटिंग में फ़ॉन्ट का आकार और ब्राइटनेस बढ़ाएँ।", "वॉइस टाइपिंग (कीबोर्ड पर माइक) चालू करें ताकि टाइप करने की जगह बोल सकें। यह हिंदी और मराठी में भी काम करती है।", "आवाज़ ज़्यादा रखें और कॉल के लिए स्पीकर या ईयरफ़ोन का उपयोग करें।", "ज़रूरी ऐप (फ़ोन, WhatsApp, कैमरा, गैलरी) पहली स्क्रीन पर रखें।", "आपातकालीन नंबर और करीबी परिवारजनों को उनकी फ़ोटो के साथ सेव करें।"] },
                        { h: "2. आम ठगी के तरीके पहचानें", p: ["ठग दयालु और भरोसा करने वाले लोगों को निशाना बनाते हैं। सबसे आम तरीके ये हैं:"], ul: ["<strong>फर्जी बैंक या KYC कॉल और मैसेज:</strong> 'आपका खाता बंद हो जाएगा, इस लिंक पर क्लिक करें।' बैंक कभी आपका OTP, PIN, CVV या पासवर्ड नहीं माँगता।", "<strong>'डिजिटल अरेस्ट' या फर्जी पुलिस कॉल:</strong> कॉल करने वाला कहता है कि आप गिरफ़्तार हैं, वीडियो कॉल पर रहने को कहता है और पैसे माँगता है। कोई असली पुलिस या एजेंसी फ़ोन या वीडियो कॉल पर किसी को गिरफ़्तार नहीं करती।", "<strong>लॉटरी, इनाम और गिफ्ट के मैसेज:</strong> जिस प्रतियोगिता में आपने भाग ही नहीं लिया उसमें इनाम नहीं जीत सकते।", "<strong>'नाती/पोता मुसीबत में है' वाली कॉल:</strong> आवाज़ कहती है 'मैं मुसीबत में हूँ, पैसे भेजो, पापा को मत बताना।' कॉल काटें और अपने परिवारजन को उनके पुराने नंबर पर फ़ोन करें।", "<strong>UPI की चाल:</strong> UPI PIN सिर्फ़ पैसे भेजने के लिए चाहिए। पैसे पाने के लिए कभी PIN डालने की ज़रूरत नहीं होती।", "<strong>सर्च में मिले फर्जी कस्टमर-केयर नंबर:</strong> हमेशा कार्ड पर छपा या आधिकारिक वेबसाइट का नंबर इस्तेमाल करें।"] },
                        { h: "3. तीन सेकंड का नियम", p: ["अगर किसी कॉल या मैसेज से डर, जल्दबाज़ी या गोपनीयता का दबाव बने, तो तीन सेकंड रुकें और खुद से पूछें: 'क्या मैं पहले किसी भरोसेमंद व्यक्ति को फ़ोन कर सकता/सकती हूँ?' असली समस्या दस मिनट रुक सकती है। ठगी नहीं रुकती।"] },
                        { h: "4. अगर कुछ गलत हो जाए", ul: ["जल्द से जल्द राष्ट्रीय साइबर क्राइम हेल्पलाइन <strong>1930</strong> पर कॉल करें। पहले कुछ घंटे सबसे अहम होते हैं।", "<strong>cybercrime.gov.in</strong> पर शिकायत दर्ज करें।", "अपने बैंक को बताएँ और कार्ड या UPI ब्लॉक करवाएँ।", "शर्म न करें। कई पढ़े-लिखे लोग भी धोखा खा जाते हैं। परिवार को जल्दी बताएँ।"] },
                        { h: "5. WhatsApp और फ़ॉरवर्ड मैसेज", ul: ["'Forwarded many times' लिखा मैसेज अक्सर झूठा होता है। जाँचे बिना न मानें, न आगे भेजें।", "बीमारी के इलाज, 'सरकारी मुफ़्त योजना' के लिंक और 'दस लोगों को भेजो वरना बुरा होगा' जैसे मैसेज ज़्यादातर फर्जी होते हैं।", "आगे भेजने से पहले परिवार के किसी सदस्य या भरोसेमंद समाचार स्रोत से पूछ लें।", "अनजान लिंक पर क्लिक न करें, और पैसे पाने के लिए QR कोड स्कैन न करें।"] },
                        { h: "6. स्क्रीन की स्वस्थ आदतें", ul: ["<strong>20-20-20 नियम:</strong> हर 20 मिनट में 20 फ़ीट दूर किसी चीज़ को 20 सेकंड देखें।", "खाने के समय और सोने से पहले के आख़िरी घंटे में फ़ोन दूर रखें।", "वीडियो देखने के बाद थोड़ी सैर करें। शरीर को स्क्रीन से ज़्यादा हलचल चाहिए।", "आवाज़ कम रखें और कानों की सुरक्षा के लिए ईयरफ़ोन का ध्यान से उपयोग करें।"] },
                        { h: "7. अच्छा पहलू: जुड़े रहें", ul: ["हफ़्ते में एक बार नाती-पोतों या रिश्तेदारों से वीडियो कॉल करें।", "परिवार के WhatsApp ग्रुप में जुड़ें और फ़ोटो साझा करें।", "भजन, कीर्तन, पुराने गाने और खबरें सुनें, और कुछ नया सीखें। कई मुफ़्त कक्षाएँ ऑनलाइन हैं।", "जगह खोजने के लिए मैप का उपयोग करें, और UPI सिर्फ़ भरोसेमंद दुकानों पर चलाएँ।"] },
                        { h: "8. परिवारजनों के लिए: कैसे मदद करें", ul: ["धैर्य रखें। एक बार में एक ही बात सिखाएँ और बटन उन्हें खुद दबाने दें।", "सरल कदम बड़े अक्षरों में कागज़ पर लिखकर दें।", "स्क्रीन लॉक चालू करें, ऑटोमैटिक अपडेट लगाएँ और आपातकालीन संपर्क जोड़ें।", "परिवार का एक कोड शब्द तय करें, ताकि असली आपातकालीन कॉल की पुष्टि हो सके।"], note: "तकनीक जीवन को आसान बनाने का साधन है, डरने की चीज़ नहीं। धीरे चलें, सवाल पूछें, और किसी को अपने ऊपर जल्दबाज़ी न थोपने दें।" }
                    ],
                    mr: [
                        { h: "1. फोन आरामदायक बनवा", ul: ["सेटिंगमध्ये फॉन्टचा आकार आणि ब्राइटनेस वाढवा.", "व्हॉइस टायपिंग (कीबोर्डवरील माइक) सुरू करा म्हणजे टाइप करण्याऐवजी बोलता येते. ते हिंदी आणि मराठीतही चालते.", "आवाज जास्त ठेवा आणि कॉलसाठी स्पीकर किंवा इअरफोन वापरा.", "महत्त्वाचे अॅप (फोन, WhatsApp, कॅमेरा, गॅलरी) पहिल्या स्क्रीनवर ठेवा.", "आपत्कालीन क्रमांक आणि जवळच्या कुटुंबीयांना त्यांच्या फोटोसह सेव्ह करा."] },
                        { h: "2. फसवणुकीचे सामान्य प्रकार ओळखा", p: ["फसवणूक करणारे दयाळू आणि विश्वास ठेवणाऱ्या लोकांना लक्ष्य करतात. सर्वात सामान्य युक्त्या:"], ul: ["<strong>बनावट बँक किंवा KYC कॉल आणि मेसेज:</strong> 'तुमचे खाते बंद होईल, या लिंकवर क्लिक करा.' बँक कधीही तुमचा OTP, PIN, CVV किंवा पासवर्ड मागत नाही.", "<strong>'डिजिटल अरेस्ट' किंवा बनावट पोलिस कॉल:</strong> कॉल करणारा म्हणतो की तुम्हाला अटक झाली आहे, व्हिडिओ कॉलवर राहायला सांगतो आणि पैसे मागतो. कोणताही खरा पोलीस किंवा यंत्रणा फोन किंवा व्हिडिओ कॉलवर कोणालाही अटक करत नाही.", "<strong>लॉटरी, बक्षीस आणि गिफ्टचे मेसेज:</strong> ज्या स्पर्धेत तुम्ही भागच घेतला नाही त्यात बक्षीस जिंकू शकत नाही.", "<strong>'नातवंड संकटात आहे' असा कॉल:</strong> आवाज म्हणतो 'मी संकटात आहे, पैसे पाठवा, बाबांना सांगू नका.' कॉल कापा आणि कुटुंबातील व्यक्तीला त्यांच्या नेहमीच्या नंबरवर फोन करा.", "<strong>UPI ची युक्ती:</strong> UPI PIN फक्त पैसे पाठवण्यासाठी लागतो. पैसे मिळवण्यासाठी कधीही PIN टाकावा लागत नाही.", "<strong>सर्चमध्ये मिळालेले बनावट कस्टमर-केअर नंबर:</strong> नेहमी कार्डवर छापलेला किंवा अधिकृत वेबसाइटवरील नंबर वापरा."] },
                        { h: "3. तीन सेकंदांचा नियम", p: ["एखाद्या कॉल किंवा मेसेजमुळे भीती, घाई किंवा गुप्ततेचा दबाव येत असेल तर तीन सेकंद थांबा आणि स्वतःला विचारा: 'मी आधी एखाद्या विश्वासू व्यक्तीला फोन करू शकतो/शकते का?' खरी अडचण दहा मिनिटे थांबू शकते. फसवणूक थांबत नाही."] },
                        { h: "4. काही चुकीचे घडले तर", ul: ["शक्य तितक्या लवकर राष्ट्रीय सायबर क्राइम हेल्पलाइन <strong>1930</strong> वर कॉल करा. पहिले काही तास सर्वात महत्त्वाचे असतात.", "<strong>cybercrime.gov.in</strong> वर तक्रार नोंदवा.", "तुमच्या बँकेला कळवा आणि कार्ड किंवा UPI ब्लॉक करायला सांगा.", "लाज वाटून घेऊ नका. अनेक शिकलेले लोकही फसतात. कुटुंबाला लवकर सांगा."] },
                        { h: "5. WhatsApp आणि फॉरवर्ड मेसेज", ul: ["'Forwarded many times' असे लिहिलेले मेसेज बहुधा खोटे असतात. तपासल्याशिवाय त्यावर विश्वास ठेवू नका आणि पुढे पाठवू नका.", "आजारांवरील उपाय, 'सरकारी मोफत योजना' च्या लिंक आणि 'दहा जणांना पाठवा नाहीतर अनिष्ट घडेल' असे मेसेज बहुधा बनावट असतात.", "पुढे पाठवण्यापूर्वी कुटुंबातील कोणाला किंवा विश्वासार्ह बातमी स्रोताला विचारा.", "अनोळखी लिंकवर क्लिक करू नका, आणि पैसे मिळवण्यासाठी QR कोड स्कॅन करू नका."] },
                        { h: "6. स्क्रीनच्या आरोग्यदायी सवयी", ul: ["<strong>20-20-20 नियम:</strong> दर 20 मिनिटांनी 20 फूट दूरच्या एखाद्या गोष्टीकडे 20 सेकंद पाहा.", "जेवणाच्या वेळी आणि झोपण्यापूर्वीच्या शेवटच्या तासात फोन दूर ठेवा.", "व्हिडिओ पाहिल्यानंतर थोडे चाला. शरीराला स्क्रीनपेक्षा हालचालीची जास्त गरज असते.", "आवाज कमी ठेवा आणि कानांच्या संरक्षणासाठी इअरफोन काळजीपूर्वक वापरा."] },
                        { h: "7. चांगली बाजू: जोडलेले राहा", ul: ["आठवड्यातून एकदा नातवंडे किंवा नातेवाइकांना व्हिडिओ कॉल करा.", "कुटुंबाच्या WhatsApp ग्रुपमध्ये सामील व्हा आणि फोटो शेअर करा.", "भजन, कीर्तन, जुनी गाणी आणि बातम्या ऐका, आणि काहीतरी नवीन शिका. अनेक मोफत वर्ग ऑनलाइन आहेत.", "ठिकाण शोधायला मॅप वापरा, आणि UPI फक्त विश्वासू दुकानांत वापरा."] },
                        { h: "8. कुटुंबीयांसाठी: मदत कशी करावी", ul: ["धीर धरा. एका वेळी एकच गोष्ट शिकवा आणि बटणे त्यांना स्वतः दाबू द्या.", "सोप्या पायऱ्या मोठ्या अक्षरांत कागदावर लिहून द्या.", "स्क्रीन लॉक सुरू करा, ऑटोमॅटिक अपडेट लावा आणि आपत्कालीन संपर्क जोडा.", "कुटुंबाचा एक कोड शब्द ठरवा, म्हणजे खऱ्या आपत्कालीन कॉलची खात्री करता येईल."], note: "तंत्रज्ञान हे जीवन सोपे करण्याचे साधन आहे, घाबरण्याची गोष्ट नाही. हळूहळू जा, प्रश्न विचारा, आणि कोणालाही तुमच्यावर घाई लादू देऊ नका." }
                    ]
                }
            };

            function renderSections(secs) {
                return secs.map(function (s) {
                    let h = "";
                    if (s.h) h += "<h3>" + s.h + "</h3>";
                    (s.p || []).forEach(function (t) { h += "<p>" + t + "</p>"; });
                    if (s.ul) h += "<ul>" + s.ul.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
                    if (s.sample) h += '<blockquote class="sample-mail">' + s.sample + "</blockquote>";
                    if (s.note) h += '<p class="reader-note"><em>' + s.note + "</em></p>";
                    return h;
                }).join("");
            }

                        title: "What Are Sensex, Nifty & Mutual Funds? (Beginner Guide)",

            function getSavedIds() {
                try {
                    return JSON.parse(localStorage.getItem("bn_saved_books") || "[]");
                } catch (err) {
                    return [];
                }
            }

            function toggleSaveId(id) {
                let list = getSavedIds();
                if (list.includes(id)) list = list.filter((x) => x !== id);
                else list.push(id);
                try {
                    localStorage.setItem("bn_saved_books", JSON.stringify(list));
                } catch (err) {}
                renderBooks();
            }

            function speak(text) {
                if (!("speechSynthesis" in window)) return;
                try {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = lang === "hi" ? "hi-IN" : lang === "mr" ? "mr-IN" : "en-IN";
                    window.speechSynthesis.speak(u);
                } catch (err) {}
            }

            /* EXACT TIME GREETING: 4:00 AM / 12:00 PM / 6:30 PM / 8:00 PM */
            function updateGreetingAndDate() {
                const now = new Date();
                const mins = now.getHours() * 60 + now.getMinutes();
                let key = "night";
                if (mins >= 240 && mins < 720) key = "morning";         // 4:00 AM - 11:59 AM
                else if (mins >= 720 && mins < 1110) key = "afternoon"; // 12:00 PM - 6:29 PM
                else if (mins >= 1110 && mins < 1200) key = "evening";  // 6:30 PM - 7:59 PM
                else key = "night";                                     // 8:00 PM - 3:59 AM

                document.getElementById("time-greeting").textContent = labels[lang][key];
                document.getElementById("lib-date").textContent = now.toLocaleDateString(
                    lang === "hi" ? "hi-IN" : lang === "mr" ? "mr-IN" : "en-IN",
                    { weekday: "long", year: "numeric", month: "long", day: "numeric" }
                );
            }

            function renderQuote() {
                const q = quotes[quoteIndex % quotes.length][lang];
                document.getElementById("quote-text").textContent = `"${q.q}"`;
                document.getElementById("quote-author").textContent = q.a;
            }

            function renderBooks() {
                const grid = document.getElementById("book-grid");
                const saved = getSavedIds();
                const query = searchVal.trim().toLowerCase();

                const list = books.filter((b) => {
                    if (activeShelf === "saved" && !saved.includes(b.id)) return false;
                    if (activeShelf !== "all" && activeShelf !== "saved" && b.shelf !== activeShelf) return false;
                    if (!query) return true;
                    const d = b[lang];
                    const longTxt = longBodies[b.id] && longBodies[b.id][lang] ? JSON.stringify(longBodies[b.id][lang]) : "";
                    return (d.title + " " + d.summary + " " + d.badge + " " + d.points.join(" ") + " " + longTxt).toLowerCase().includes(query);
                });

                if (!list.length) {
                    const msg = activeShelf === "saved" ? labels[lang].emptySaved : "No matching guides found.";
                    grid.innerHTML = `<div class="empty-state">${msg}</div>`;
                    return;
                }

                grid.innerHTML = list.map((b) => {
                    const d = b[lang];
                    const isSaved = saved.includes(b.id);
                    return `
                        <article class="book-card">
                            <div class="book-top">
                                <span class="guide-badge">${d.badge}</span>
                                <span class="book-meta">${b.time}</span>
                            </div>
                            <h3>${d.title}</h3>
                            <p>${d.summary}</p>
                            <div style="display:flex; gap:8px; margin-top:auto;">
                                <button type="button" class="open-book-btn" style="flex:1;" data-open-book="${b.id}">${labels[lang].openBtn}</button>
                                <button type="button" class="bookmark-btn ${isSaved ? "saved" : ""}" data-save-book="${b.id}">
                                    ${isSaved ? labels[lang].savedBtn : labels[lang].saveBtn}
                                </button>
                            </div>
                        </article>
                    `;
                }).join("");
            }

            function applyLang(newLang) {
                if (!labels[newLang]) newLang = "en";
                lang = newLang;
                document.documentElement.lang = lang;
                try { localStorage.setItem("bn_lang", lang); } catch (err) {}

                const t = labels[lang];
                document.getElementById("circle-text").textContent = t.circle;
                document.getElementById("lib-title").innerHTML = t.title;
                document.getElementById("back-home-link").textContent = t.backHome;
                document.getElementById("terms-link").textContent = t.terms;
                document.getElementById("quote-label").textContent = t.quoteLabel;
                document.getElementById("next-quote-btn").textContent = t.nextQuote;
                document.getElementById("speak-quote-btn").textContent = t.hearQuote;
                document.getElementById("lib-search").placeholder = t.searchPh;
                document.getElementById("sh-all").textContent = t.shAll;
                document.getElementById("sh-saved").textContent = t.shSaved;
                document.getElementById("sh-study").textContent = t.shStudy;
                document.getElementById("sh-finance").textContent = t.shFinance;
                document.getElementById("sh-tech").textContent = t.shTech;
                document.getElementById("sh-life").textContent = t.shLife;
                document.getElementById("reader-speak-btn").textContent = t.readAloud;
                document.getElementById("reader-close-btn").textContent = t.closeBtn;

                document.querySelectorAll(".lang-btn").forEach((b) => {
                    b.classList.toggle("active", b.dataset.lang === lang);
                });

                updateGreetingAndDate();
                renderQuote();
                renderBooks();
            }

            function init() {
                // Daily automatic quote index by day of month
                quoteIndex = new Date().getDate() % quotes.length;

                // Load saved preferences from Home page
                try {
                    const savedLang = localStorage.getItem("bn_lang");
                    if (savedLang && labels[savedLang]) lang = savedLang;
                    if (localStorage.getItem("bn_large_text") === "1") {
                        document.body.classList.add("large-text");
                        document.getElementById("lib-font-btn").classList.add("active");
                    }
                    if (localStorage.getItem("bn_light_mode") === "1") {
                        document.body.classList.add("light-mode");
                        document.getElementById("lib-theme-btn").textContent = "🌙";
                    }
                } catch (err) {}

                // Circle splash (~1.8s)
                const splash = document.getElementById("lib-splash");
                const skipBtn = document.getElementById("lib-skip-btn");
                const timer = setTimeout(() => splash.classList.add("hide"), 1800);
                skipBtn.addEventListener("click", () => {
                    clearTimeout(timer);
                    splash.classList.add("hide");
                });

                // Top controls
                document.querySelectorAll(".lang-btn").forEach((b) => {
                    b.addEventListener("click", () => applyLang(b.dataset.lang));
                });

                document.getElementById("lib-font-btn").addEventListener("click", function () {
                    const isLarge = document.body.classList.toggle("large-text");
                    this.classList.toggle("active", isLarge);
                    try { localStorage.setItem("bn_large_text", isLarge ? "1" : "0"); } catch (err) {}
                });

                document.getElementById("lib-theme-btn").addEventListener("click", function () {
                    const isLight = document.body.classList.toggle("light-mode");
                    this.textContent = isLight ? "🌙" : "☀";
                    try { localStorage.setItem("bn_light_mode", isLight ? "1" : "0"); } catch (err) {}
                });

                document.getElementById("lib-voice-btn").addEventListener("click", function () {
                    voiceOn = !voiceOn;
                    this.textContent = voiceOn ? "🔊 Voice: ON" : "🔇 Voice: OFF";
                    this.classList.toggle("active", voiceOn);
                    if (voiceOn) {
                        const q = quotes[quoteIndex % quotes.length][lang];
                        speak(labels[lang].circle + ". " + q.q);
                    } else if ("speechSynthesis" in window) {
                        window.speechSynthesis.cancel();
                    }
                });

                document.getElementById("next-quote-btn").addEventListener("click", () => {
                    quoteIndex++;
                    renderQuote();
                });

                document.getElementById("speak-quote-btn").addEventListener("click", () => {
                    const q = quotes[quoteIndex % quotes.length][lang];
                    speak(q.q + " " + q.a);
                });

                // Search & Shelf tabs
                document.getElementById("lib-search").addEventListener("input", (e) => {
                    searchVal = e.target.value;
                    renderBooks();
                });

                document.querySelectorAll("[data-shelf]").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        activeShelf = btn.dataset.shelf;
                        document.querySelectorAll("[data-shelf]").forEach((b) => b.classList.remove("active"));
                        btn.classList.add("active");
                        renderBooks();
                    });
                });

                // Book clicks & Reader Modal
                const modal = document.getElementById("reader-modal");
                document.getElementById("book-grid").addEventListener("click", (e) => {
                    const saveBtn = e.target.closest("[data-save-book]");
                    if (saveBtn) {
                        toggleSaveId(saveBtn.dataset.saveBook);
                        return;
                    }
                    const openBtn = e.target.closest("[data-open-book]");
                    if (openBtn) {
                        currentBook = books.find((b) => b.id === openBtn.dataset.openBook);
                        if (!currentBook) return;
                        const d = currentBook[lang];
                        document.getElementById("reader-title").textContent = d.title;
                        const longSecs = longBodies[currentBook.id] && longBodies[currentBook.id][lang];
                        document.getElementById("reader-body").innerHTML = longSecs
                            ? renderSections(longSecs)
                            : `<ul>${d.points.map((p) => `<li>${p}</li>`).join("")}</ul>`;
                        document.querySelector(".reader-box").scrollTop = 0;
                        modal.hidden = false;
                    }
                });

                function closeModal() {
                    modal.hidden = true;
                    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                }

                document.getElementById("reader-close-btn").addEventListener("click", closeModal);
                document.getElementById("reader-close-top").addEventListener("click", closeModal);
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) closeModal();
                });

                document.getElementById("reader-speak-btn").addEventListener("click", () => {
                    if (!currentBook) return;
                    const plain = document.getElementById("reader-body").textContent;
                    speak(currentBook[lang].title + ". " + plain);
                });

                applyLang(lang);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        })();
    </script>
